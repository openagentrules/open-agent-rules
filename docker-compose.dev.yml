# Local static server for site/ — same Node major as CI (22) and the same
# zero-dependency script `./dev.sh local` runs natively, so the two modes
# cannot drift apart.
# Run: ./dev.sh   or   docker compose -f docker-compose.dev.yml up
services:
  site:
    image: node:22-alpine
    working_dir: /src
    ports:
      - "8788:8788"
    volumes:
      - ./site:/src/site:ro
      - ./scripts:/src/scripts:ro
    command:
      - node
      - scripts/serve.mjs
      - --host=0.0.0.0
      - --port=8788
